name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      voll:
        description: 'Voller Abgleich: alles neu hochladen und Fremdes auf dem Server loeschen'
        type: boolean
        default: false

# Immer nur ein Deploy zur Zeit, in der Reihenfolge der Pushes. Der Diff-Deploy
# liest die Marke des vorigen Laufs, zwei gleichzeitige Laeufe wuerden sich
# dabei in die Quere kommen.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Volle Historie: der Deploy vergleicht mit dem zuletzt ausgerollten Commit.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # lftp installiert sich im Hintergrund, waehrend die Tests laufen.
      - name: lftp im Hintergrund installieren
        run: |
          nohup bash -c 'sudo apt-get install -y --no-install-recommends lftp > "$RUNNER_TEMP/lftp.log" 2>&1; echo $? > "$RUNNER_TEMP/lftp.rc"' > /dev/null 2>&1 &

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml, mbstring, curl
          coverage: none
      - name: Syntax
        run: find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: php tests/run.php

      - name: Auf lftp warten
        run: |
          timeout 180 bash -c 'until [ -f "$RUNNER_TEMP/lftp.rc" ]; do sleep 1; done' || true
          if [ "$(cat "$RUNNER_TEMP/lftp.rc" 2>/dev/null)" != "0" ]; then
            cat "$RUNNER_TEMP/lftp.log" || true
            echo "::error::lftp liess sich nicht installieren."
            exit 1
          fi

      # Sicherung vor dem Deploy: der volle Abgleich loescht alles, was nicht im
      # Repo ist. Zeigt DEPLOY_PATH versehentlich auf das Home-Verzeichnis des
      # SFTP-Nutzers (leer, "/" oder "." bei einem chrooted Zugang, oder ein
      # Verzeichnis mit .bashrc, public_html, www_logs), bricht der Lauf hier ab.
      - name: Zielverzeichnis pruefen
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          case "${DEPLOY_PATH:-}" in
            ""|"/"|"."|"./"|"~"|"~/")
              echo "::error::DEPLOY_PATH ist leer oder zeigt auf das Wurzel- bzw. Home-Verzeichnis des SFTP-Nutzers. Bitte den Pfad zum Web-Root der Domain eintragen."
              exit 1;;
          esac
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            open -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" \"sftp://$DEPLOY_HOST\";
            cls -a \"$DEPLOY_PATH\"
          " > "$RUNNER_TEMP/remote-listing.txt"
          echo "Inhalt von $DEPLOY_PATH:"; cat "$RUNNER_TEMP/remote-listing.txt"
          if grep -qE '(^|/)(\.bashrc|\.bash_logout|\.profile|\.phpversion|\.ssh|public_html|www_logs|htdocs|logs)/?$' "$RUNNER_TEMP/remote-listing.txt"; then
            echo "::error::DEPLOY_PATH sieht wie das Home-Verzeichnis des SFTP-Nutzers aus, nicht wie das Web-Root. Deploy abgebrochen, nichts geaendert."
            exit 1
          fi

      # Uebertraegt nur die Dateien, die sich seit dem letzten Deploy geaendert
      # haben. Details und die Faelle fuer den vollen Abgleich stehen im Skript.
      - name: Deploy via SFTP
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_VOLL: ${{ inputs.voll && '1' || '' }}
        run: bash .github/scripts/deploy.sh
