name: Vorschau v2

# Spiegelt den Design-Branch nach /v2/ unter der Live-Domain, zum Anschauen
# neben der echten Seite. config.php und cache/ der Live-Seite werden per
# Symlink mitbenutzt, damit die Vorschau echte Daten zeigt (die Formate in
# cache/ sind unveraendert). Die Vorschau ist noindex. Der naechste Deploy von
# main loescht /v2/ wieder, weil sein Mirror alles entfernt, was nicht im Repo ist.

on:
  push:
    branches:
      - design-streckenband
  workflow_dispatch:

concurrency:
  group: preview-v2
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml, mbstring, curl
          coverage: none
      - name: Syntax
        run: find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: php tests/run.php

  preview:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      # Suchmaschinen sollen die Vorschau nicht aufnehmen
      - name: Vorschau kennzeichnen
        run: |
          printf '\n# Vorschau v2: nicht indexieren\n<IfModule mod_headers.c>\n\tHeader always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> .htaccess

      - name: Deploy nach /v2/
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          case "${DEPLOY_PATH:-}" in
            ""|"/"|"."|"./"|"~"|"~/")
              echo "::error::DEPLOY_PATH ist leer oder zeigt auf das Wurzel- bzw. Home-Verzeichnis."
              exit 1;;
          esac
          TARGET="${DEPLOY_PATH%/}/v2"
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" \"sftp://$DEPLOY_HOST\";
            mkdir -pf \"$TARGET\";
            mirror --reverse --delete --verbose \
              --exclude='^\.git/' \
              --exclude='^\.github/' \
              --exclude='^\.claude/' \
              --exclude='^\.gitignore$' \
              --exclude='^tests/' \
              --exclude='^dev/' \
              --exclude='^config\.php$' \
              --exclude='^cache$' \
              --exclude='^cache/' \
              --exclude='^README\.md$' \
              ./ \"$TARGET\";
            bye
          "
          # Konfiguration und Daten der Live-Seite mitbenutzen. Existieren die
          # Links schon, scheitert ln; das ist in Ordnung.
          lftp -c "
            set sftp:auto-confirm yes;
            open -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" \"sftp://$DEPLOY_HOST\";
            cd \"$TARGET\";
            ln -s ../config.php config.php;
            ln -s ../cache cache;
            bye
          " || true
          lftp -c "
            set sftp:auto-confirm yes;
            open -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" \"sftp://$DEPLOY_HOST\";
            cls -l \"$TARGET\"
          " | grep -E 'config\.php|cache' || echo "::warning::Symlinks auf config.php und cache/ fehlen, die Vorschau laeuft ohne Daten."
