name: Vorschau v2

# Spiegelt den Design-Branch nach /v2/ unter der Live-Domain, zum Anschauen
# neben der echten Seite. Die Vorschau liest config.php und cache/ der
# Live-Seite eine Ebene hoeher, damit sie echte Daten zeigt (die Formate in
# cache/ sind unveraendert). Dafuer passt der Lauf nur seine eigene Kopie
# an. Die Vorschau ist noindex. Der naechste Deploy von main loescht /v2/
# wieder, weil sein Mirror alles entfernt, was nicht im Repo ist.

on:
  push:
    branches:
      - design-streckenband
  workflow_dispatch:

concurrency:
  group: preview-v2
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml, mbstring, curl
          coverage: none
      - name: Syntax
        run: find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: php tests/run.php

  preview:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      # Suchmaschinen sollen die Vorschau nicht aufnehmen; Daten und
      # Konfiguration kommen aus dem Web-Root der Live-Seite
      - name: Vorschau vorbereiten
        run: |
          sed -i "s#__DIR__ . '/../cache'#__DIR__ . '/../../cache'#" api/store.php
          grep -q "'/../../cache'" api/store.php
          printf '<?php\n// Vorschau v2: Konfiguration der Live-Seite\nreturn require __DIR__ . %s;\n' "'/../config.php'" > config.php
          php -l config.php
          printf '\n# Vorschau v2: nicht indexieren\n<IfModule mod_headers.c>\n\tHeader always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> .htaccess

      - name: Deploy nach /v2/
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          case "${DEPLOY_PATH:-}" in
            ""|"/"|"."|"./"|"~"|"~/")
              echo "::error::DEPLOY_PATH ist leer oder zeigt auf das Wurzel- bzw. Home-Verzeichnis."
              exit 1;;
          esac
          TARGET="${DEPLOY_PATH%/}/v2"
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u \"$DEPLOY_USER\",\"$DEPLOY_PASSWORD\" \"sftp://$DEPLOY_HOST\";
            mkdir -pf \"$TARGET\";
            mirror --reverse --delete --verbose \
              --exclude='^\.git/' \
              --exclude='^\.github/' \
              --exclude='^\.claude/' \
              --exclude='^\.gitignore$' \
              --exclude='^tests/' \
              --exclude='^dev/' \
              --exclude='^cache/' \
              --exclude='^README\.md$' \
              ./ \"$TARGET\";
            bye
          "

      # Kurzer Blick von aussen: Status, Laenge und Anfang der Antwort
      - name: Vorschau pruefen
        run: |
          for u in https://bahn-pinneberg.de/v2/ https://bahn-pinneberg.de/v2/dashboard.css https://bahn-pinneberg.de/v2/api/s3 https://bahn-pinneberg.de/v2/faq/; do
            echo "== $u"
            curl -sS -o body.txt -D head.txt -w 'HTTP %{http_code}, %{size_download} Bytes\n' "$u" || true
            grep -iE '^(content-type|location|x-robots)' head.txt || true
            head -c 300 body.txt; echo
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' https://bahn-pinneberg.de/v2/)" = 200
          curl -s https://bahn-pinneberg.de/v2/ | grep -q 'id="abfahrten"'
